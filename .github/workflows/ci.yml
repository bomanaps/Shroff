name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: node --test --import tsx packages/gateway/src/*.test.ts packages/spec-compiler/src/*.test.ts packages/loop/src/*.test.ts packages/referee/src/*.test.ts
