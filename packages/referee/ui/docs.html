<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shroff Docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
</head>
<body class="docs-page">

<header class="hud">
  <div class="brand">
    <a href="/" class="chip">back to the referee</a>
  </div>
  <span class="chainbadge">integration docs</span>
</header>

<main class="docs">
  <p class="eyebrow">Shroff · developer documentation</p>
  <article id="doc-body"><p class="lede">loading…</p></article>
</main>

<footer class="foot-note docs-foot">
  Shroff · the delivery referee for agent payments · Kane CLI is the judge ·
  <a href="https://github.com/bomanaps/Shroff">GitHub</a>
</footer>

<script>
fetch("/integration.md")
  .then((r) => r.text())
  .then((md) => {
    document.getElementById("doc-body").innerHTML = marked.parse(md);
  })
  .catch(() => {
    document.getElementById("doc-body").textContent =
      "Could not load the guide. Read docs/INTEGRATION.md in the repository.";
  });
</script>
</body>
</html>
